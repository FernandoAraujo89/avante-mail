# Stack de produção do Avante Mail no VPS.
#
# Camada de borda (nginx + certbot + monitoramento) fica no HOST e é
# compartilhada por todas as aplicações do servidor; cada app vive no seu
# próprio projeto compose, com banco e fila isolados.
#
# Portas publicadas apenas em 127.0.0.1 — assim o nginx (proxy_pass :3000),
# o script de backup (pg_dump em :5432) e as migrações continuam funcionando
# sem alteração, e nada fica exposto à internet.
#
# Segredos de interpolação (${POSTGRES_PASSWORD}, ${REDIS_PASSWORD}) vêm do
# arquivo .env ao lado deste compose — existe SÓ no servidor (fora do git e
# fora do rsync). Os demais envs do app vêm do .env.local (env_file); as URLs
# de banco/fila são sobrescritas aqui porque dentro da rede do compose os
# hosts são os nomes dos serviços (db/redis), não 127.0.0.1.

name: avante-mail

services:
  app:
    build: .
    image: avante-mail:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env.local
    environment:
      DATABASE_URL: postgresql://avante:${POSTGRES_PASSWORD}@db:5432/avante_mail
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      UPLOADS_DIR: /data/uploads
      NODE_ENV: production
    volumes:
      # Uploads sobrevivem a rebuilds/deploys (mesmo diretório de antes).
      - /root/avante-mail-uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: avante-mail:latest
    build: .
    command: ["npx", "tsx", "worker/email-worker.ts"]
    restart: unless-stopped
    env_file: .env.local
    environment:
      DATABASE_URL: postgresql://avante:${POSTGRES_PASSWORD}@db:5432/avante_mail
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Worker do canal WhatsApp (fila whatsapp-sends). Sem as envs WHATSAPP_* no
  # .env.local ele sobe em MODO OCIOSO (loga e aguarda) — pode ir ao ar antes
  # da conta Meta existir, sem crash loop e sem tocar no canal de e-mail.
  whatsapp-worker:
    image: avante-mail:latest
    build: .
    command: ["npx", "tsx", "worker/whatsapp-worker.ts"]
    restart: unless-stopped
    env_file: .env.local
    environment:
      DATABASE_URL: postgresql://avante:${POSTGRES_PASSWORD}@db:5432/avante_mail
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:18
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: avante
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: avante_mail
    volumes:
      # A imagem postgres:18 mudou o layout: o VOLUME oficial é
      # /var/lib/postgresql (o PGDATA fica em subdiretório versionado).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avante -d avante_mail"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    # Paridade com o redis 7.x que rodava no host.
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD}",
        "--maxmemory-policy",
        "noeviction",
        "--appendonly",
        "yes",
      ]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      # Persistência da fila (jobs atrasados de campanhas agendadas
      # sobrevivem a restart do contêiner).
      - redisdata:/data
    healthcheck:
      # Interpolação do compose ($ simples) de propósito: a senha não existe
      # como env DENTRO do contêiner (só no command), então $$ expandiria
      # vazio e o healthcheck nunca passaria. A senha já aparece no command —
      # nenhuma exposição nova.
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
  redisdata:
